<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretch</title>

    <style>
        .stretch-button{
            color: white;
            background-color: green;
            border: none;
            padding-left: 14px;
            padding-top: 7px;
            padding-right: 14px;
            padding-bottom: 7px;
            transition: padding 0.5s;
            cursor: pointer;
        }
        .stretch-button:hover{
            padding-left: 32px;
            padding-top: 14px;
            padding-right: 32px;
            padding-bottom: 14px;
        }
    </style>
</head>
<body>
    <button class="stretch-button">Stretch</button>
</body>
</html>
