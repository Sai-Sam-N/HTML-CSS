<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber</title>

    <style>
        .uber-button{
            background-color: black;
            color: white;
            border: none;
            /* height: 35px;
            width: 120px; */
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 21px;
            padding-right: 21px;
            /* My speculation -> top & bottom padding = (height/2) - (values 7 to 10) */
            transition: opacity 0.15s;
        }

        .uber-button:hover{
            opacity: 0.7;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="uber-button">Request now</button>
</body>
</html>
