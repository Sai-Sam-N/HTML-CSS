<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Fixed] Margin and Padding together</title>
    <style>
        .num-button{
            background-color: green;
            color: white;
            border: none;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 4px;
            padding-bottom: 4px;

            margin-right: 10px;
            margin-left: 10px;
        }
        .num-button:hover{
            padding-left: 15px;
            padding-right: 15px;
            margin-left: 5px;
            margin-right: 5px;
        }

        } */

        /* .num-button:hover{
            padding-left: 17px;

            margin-right: 3px;
            margin-left: 3px;
        } */
    </style>
</head>
<body>
    <button class="num-button" id="one-button">One</button>
    <button class="num-button" id="two-button">Two</button>
    <button class="num-button" id="three-button">Three</button>
</body>
</html>
