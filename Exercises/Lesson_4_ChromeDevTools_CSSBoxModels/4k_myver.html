<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding together</title>
    <style>
        .button{
            border: none;
            cursor: pointer;
            background-color: green;
            color: white;
            margin-right: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 4px;
            padding-bottom: 4px;
            transition: padding 0.5s;
        }
        .button:hover{
            padding-left: 17px;
            padding-right: 17px;
        }
    </style>
</head>
<body>
    <button class="button" id="one-button">One</button>
    <button class="button" id="two-button">Two</button>
    <button class="button" id="three-button">Three</button>
</body>
</html>
