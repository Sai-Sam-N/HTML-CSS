<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Click</title>
    <style>
        .shadow-button{
            cursor: pointer;
            background-color: green;
            color: white;
            border: none;
            padding-left: 13px;
            padding-top: 6px;
            padding-right: 13px;
            padding-bottom: 6px;
            box-shadow: 3px 3px 2px rgba(60, 66, 57, 0.276);
        }
        .shadow-button:active{
            /* box-shadow: -3px -3px 1px rgba(60, 66, 57, 0.276); */
            box-shadow: none;
            /* vertical-align: left; */
            margin-top: 3px;
            margin-left: 3px;
        }
    </style>
</head>
<body>
    <button class="shadow-button">Shadow</button>
</body>
</html>
