<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination</title>

    <style>
        button{
            border-color: rgb(128, 131, 134);
            border-width: 0.75px;
            border-style: solid;
            border-radius: 3px;
            padding-top: 6px;
            padding-bottom: 6px;
        }
        a{
            margin-right: 4px;
        }
        .next-button{
            margin-left: 6px;
            vertical-align: middle;
        }
        .back-button{
            margin-right: 10px;
            vertical-align: middle;
        }

    </style>
</head>
<body>
    <button class="back-button">Back</button>
    <a href="https://des.analyticsindiamag.com/ticket-pricing/">1</a>
    <a href="https://des.analyticsindiamag.com/ticket-pricing/">2</a>
    <a href="https://des.analyticsindiamag.com/ticket-pricing/">3</a>
    <a href="https://des.analyticsindiamag.com/ticket-pricing/">4</a>
    <a href="https://des.analyticsindiamag.com/ticket-pricing/">5</a>
    <button class="next-button">Next</button>
</body>
</html>
